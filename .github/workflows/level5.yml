name: Running level 5

on:
  # Runs once immediately on every deploy to main. The recurring schedule now
  # lives in the github-actions-scheduler Cloudflare Worker, which dispatches
  # this workflow at fixed IST times via workflow_dispatch. A schedule: block
  # here would double-run it.
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    environment: api_key

    env:
      API_KEY1: ${{ secrets.API_KEY1 }}
      API_KEY2: ${{ secrets.API_KEY2 }}
      API_KEY3: ${{ secrets.API_KEY3 }}
      API_KEY4: ${{ secrets.API_KEY4 }}
      API_KEY5: ${{ secrets.API_KEY5 }}
      API_KEY6: ${{ secrets.API_KEY6 }}
      SUPABASE_URL: ${{secrets.SUPABASE_URL}}
      SUPABASE_KEY: ${{secrets.SUPABASE_KEY}}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: "3.10"

      # Restores the whole virtualenv. On a hit the install step is skipped
      # entirely - no pip, no downloads. The key includes the exact patch
      # version because a cached venv symlinks into that interpreter.
      - name: Restore Python venv
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          .venv/bin/pip install -r requirements.txt

      # all-MiniLM-L6-v2 (~90 MB) is otherwise re-downloaded from HuggingFace
      # on every run.
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2-${{ runner.os }}
          restore-keys: hf-all-MiniLM-L6-v2-

      - name: Run script
        run: .venv/bin/python level5/level5.py
